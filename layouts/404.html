{{- /* GitHub Pages serves this page for any missing path, nested ones included,
  so every reference is root-relative (relURL against baseURL). One line of
  copy and one way home (#421). */ -}}
{{ define "main" }}
    <main id="main">
      <section class="wrap empty-state" aria-labelledby="missing-title">
        <figure class="missing-art">
          <img src="{{ "assets/brand/cast/mouse-marine-salute.webp" | relURL }}" alt="Mouse Marine, a mallard in a green beret saluting from a gold trackball on a small tank, cursor spear in hand" width="960" height="540">
        </figure>
        <h1 id="missing-title" class="display">This page went out of range.</h1>
        <p><a href="{{ "" | relURL }}">Back to the home page</a></p>
      </section>
    </main>
{{- end }}
