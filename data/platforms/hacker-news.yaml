# Supported actions on Hacker News. See linkedin.yaml for the shared rules.
key: hacker-news
name: Hacker News
weight: 4
docs: /docs/reference/platforms/hacker-news/
reach: Your own Chrome, through the Blowhorn extension
signin: Blowhorn signs in with the Hacker News username and password you saved in your account.
actions:
  - name: Post
    command: blowhorn post --platform hn
    behavior: Submits a link or a text post. Titles hold up to 80 characters; a longer title is refused, never cut short, because a submission can't be edited once it's up.
    limits: At most 2 link submissions per profile a day. Preview first with --dry-run, because every submission is permanent.
  - name: Comment
    command: blowhorn post --platform hn
    behavior: Comments on the Hacker News item your post is addressed to, under your name.
  - name: Vote
    command: none
    behavior: Never. Blowhorn doesn't vote on Hacker News, and there's no setting to turn it on.
