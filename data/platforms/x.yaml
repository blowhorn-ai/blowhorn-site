# Supported actions on X. See linkedin.yaml for the shared rules.
key: x
name: X (Twitter)
weight: 2
docs: /docs/reference/platforms/x/
reach: Your own signed-in Chrome, through the Blowhorn extension
signin: Sign in to X in your Chrome profile once, by hand.
actions:
  - name: Post
    command: blowhorn post --platform x
    behavior: Publishes your message, with an image if you add one. A message longer than 274 characters goes out as a thread.
  - name: Reply
    command: blowhorn post --platform x
    behavior: Replies in a conversation when your post is addressed to it.
  - name: Amplify
    command: blowhorn post --platform x --amplify <post>
    behavior: Retweets or quotes a post from each of your profiles.
  - name: Follow
    command: blowhorn follow --platform x
    behavior: Follows the accounts you list, skipping anyone you already follow.
    limits: At most 400 follows per profile a day, and 15 in any 15 minutes.
  - name: Analytics
    command: blowhorn analytics --platform x
    behavior: Records your follower and following counts on each run, so you can watch the trend.
    limits: Read-only.
