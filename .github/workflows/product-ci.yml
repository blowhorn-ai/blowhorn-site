name: Product CI

# Runs the product repository's own CI (its ci.yml: the Python suite, the
# desktop typecheck, lint, test and build, and the Rust engine tests) on this
# public repository's free runners. The product repository is private and has no Actions minutes, so
# nothing runs there; this workflow checks it out at one commit instead.
#
# The logs here are public, so they must never show private code:
#   - every command's output goes to a log under RUNNER_TEMP that is never
#     printed or cached, and never uploaded as plaintext
#     (.github/scripts/product-ci/run.py)
#   - the step output is fixed labels, exit statuses and pass/fail counts, plus
#     failing pytest/cargo/vitest test names and vitest Unhandled Errors headings
#     (names only; never assertion text, stacks or source)
#   - no cache and no job summary (the commands run without
#     GITHUB_STEP_SUMMARY and the other file-command variables); the checkout
#     keeps no credential
#   - one artifact, and only when a suite fails: run.py encrypts that suite's
#     full log with age to the public recipient LOG_RECIPIENT (encrypted-log/encrypted_log.py) into
#     RUNNER_TEMP/product-ci-encrypted/, and the upload step takes only the
#     *.age ciphertext there, kept 3 days. The private key is in no repository
#     and never on a runner. Without age the run uploads nothing.
#   - DMG_SOURCE_TOKEN (read-only) is used by the product checkout step alone
# A failure says which step failed; `make product-ci-log RUN=<run id>
# SUITE=<suite>` downloads and decrypts its log for a key holder, or run
# `make tests` in a product checkout.
#
# Run: gh workflow run product-ci.yml -R blowhorn-ai/blowhorn-site -f ref=<40-char commit sha>
# The result is reported on the product commit as the "product-ci" status.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Product commit to test (full 40-character SHA)"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Product commit to test (full 40-character SHA)"
        required: true
        type: string
      caller:
        description: >
          Calling workflow id (set by build-dmg). A non-empty value gives this
          run its own concurrency group and never cancels another. Leave unset
          for a manual Product CI run.
        required: false
        type: string
        default: ""
    secrets:
      DMG_SOURCE_TOKEN:
        required: true

run-name: Product CI ${{ inputs.ref }}

permissions:
  contents: read

# Manual Product CI still cancels an in-progress run of the same ref.
# A build-dmg call passes `caller` so this run gets its own group (caller plus
# this run id) and cancel-in-progress is false. Adhoc and signed calls of the
# same SHA therefore cannot cancel each other, and neither can cancel a manual
# Product CI run of that SHA.
#
# Do not detect a reusable call with github.event_name. In a called workflow
# that value is the caller's event (workflow_dispatch or repository_dispatch
# for build-dmg), never workflow_call, so a run-id suffix keyed on
# event_name == 'workflow_call' is never added. github.event.workflow is also
# not enough: it is set for workflow_dispatch, but a repository_dispatch
# payload has no workflow field, and that is the path make release uses.
# Pin: .github/scripts/test_product_ci_run.py (ProductCiConcurrencyTest).
concurrency:
  group: product-ci-${{ inputs.ref }}-${{ inputs.caller && format('{0}-{1}', inputs.caller, github.run_id) || 'manual' }}
  cancel-in-progress: ${{ !inputs.caller }}

jobs:
  python:
    name: python (py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the product commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blowhorn-ai/blowhorn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The product's asset-manifest test measures videos with ffprobe, and the
      # runner image does not ship ffmpeg.
      - name: Install ffmpeg (ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null

      # Encrypts a failed suite's log for the artifact below. Optional: without
      # it run.py says so and nothing is uploaded.
      - name: Install age
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age >/dev/null

      - name: Python suite (output withheld)
        run: make product-ci SUITE=python PRODUCT_DIR=product PRODUCT_CI_LOG="$RUNNER_TEMP/product-ci/python.log" PRODUCT_CI_ENCRYPTED_DIR="$RUNNER_TEMP/product-ci-encrypted"

      # The age ciphertext of the failed suite's log, nothing else (run.py).
      - name: Upload the encrypted log (failed suite only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-ci-python-log-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-ci-encrypted/*.age
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0

  desktop:
    name: desktop (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the product commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blowhorn-ai/blowhorn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Encrypts a failed suite's log for the artifact below. Optional: without
      # it run.py says so and nothing is uploaded.
      - name: Install age
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age >/dev/null

      - name: Desktop checks (output withheld)
        run: make product-ci SUITE=desktop PRODUCT_DIR=product PRODUCT_CI_LOG="$RUNNER_TEMP/product-ci/desktop.log" PRODUCT_CI_ENCRYPTED_DIR="$RUNNER_TEMP/product-ci-encrypted"

      # The age ciphertext of the failed suite's log, nothing else (run.py).
      - name: Upload the encrypted log (failed suite only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-ci-desktop-log-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-ci-encrypted/*.age
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the requested commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the product commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blowhorn-ai/blowhorn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.DMG_SOURCE_TOKEN }}
          path: product
          persist-credentials: false

      # The contract suite runs every case against the Python engine too
      # (make cli-rust-tests). The product's own rust CI sets
      # BLOWHORN_CONTRACT_PYTHON after installing engine/requirements-dev.txt;
      # without that, Engine::from_env looks for product/venv and fails at
      # every_case_is_at_contract with "no virtualenv in the checkout".
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the product's Python engine dependencies
        run: python -m pip install --disable-pip-version-check -r product/engine/requirements-dev.txt

      # rustup itself, if this image does not already have it. The toolchain
      # (and rustfmt, clippy, wasm32) is the one product/engine/rust/rust-toolchain.toml
      # pins, installed here because no make target installs anything. Never
      # a second copy of the version in this file. Same command as the
      # product's own CI (blowhorn `.github/workflows/ci.yml`).
      - name: Install the product's pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          test -f product/engine/rust/rust-toolchain.toml
          cd product/engine/rust && timeout 600 rustup toolchain install

      # The live Chrome background-tab test (product engine/rust/cdp/tests/live_chrome.rs)
      # runs headed under xvfb-run and reads the selected tab from the window title
      # with xdotool, which it requires on Linux. The runner image ships Google
      # Chrome and xvfb but not xdotool.
      - name: Install xdotool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xdotool >/dev/null

      # Encrypts a failed suite's log for the artifact below. Optional: without
      # it run.py says so and nothing is uploaded.
      - name: Install age
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age >/dev/null

      # The parity tests (product engine/rust/service/tests/common/mod.rs) run the
      # Python engine with a cleared environment, so they need an absolute
      # interpreter path; without it they look for product/venv and fail.
      - name: Rust suite (output withheld)
        env:
          BLOWHORN_CONTRACT_PYTHON: python
          BLOWHORN_PARITY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: make product-ci SUITE=rust PRODUCT_DIR=product PRODUCT_CI_LOG="$RUNNER_TEMP/product-ci/rust.log" PRODUCT_CI_ENCRYPTED_DIR="$RUNNER_TEMP/product-ci-encrypted"

      # The age ciphertext of the failed suite's log, nothing else (run.py).
      - name: Upload the encrypted log (failed suite only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-ci-rust-log-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-ci-encrypted/*.age
          retention-days: 3
          if-no-files-found: ignore
          compression-level: 0
