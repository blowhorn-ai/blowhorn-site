name: Site Preview Post-Build

on:
  workflow_run:
    workflows: ["Build Site Preview"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: site-preview-post-build-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PREVIEW_RETENTION_LIMIT: 6

defaults:
  run:
    shell: bash

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    outputs:
      deployed: ${{ steps.meta.outputs.deploy }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # workflow_run checks out trusted master, never the PR or artifact code.
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-preview-build
          path: temp-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate metadata and current PR head
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make site-preview-validate

      - name: Deploy PR preview
        if: steps.meta.outputs.deploy == 'true'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./temp-artifact/public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.meta.outputs.pr_number }}
          pages-base-url: blowhorn.ai
          action: deploy
          wait-for-pages-deployment: false
          comment: false
          deploy-commit-message: Deploy preview for PR ${{ steps.meta.outputs.pr_number }} at ${{ steps.meta.outputs.sha }}

      - name: Comment PR with preview URL
        if: steps.meta.outputs.deploy == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          number: ${{ steps.meta.outputs.pr_number }}
          message: |
            Preview deployment: https://blowhorn.ai/pr-preview/pr-${{ steps.meta.outputs.pr_number }}/
            Commit: `${{ steps.meta.outputs.sha }}`
            > Preview may take a moment while GitHub Pages deploys. [Track deployment](https://github.com/${{ github.repository }}/actions/workflows/pages/pages-build-deployment), then refresh.

  prune:
    # Both jobs push gh-pages. Deploy first; housekeeping retries lost races.
    needs: deploy-preview
    if: needs.deploy-preview.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout gh-pages for preview retention
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true # retention pushes back to gh-pages
          sparse-checkout: pr-preview
          path: gh-pages-maintenance

      - name: Prune old PR previews
        id: prune-previews
        continue-on-error: true
        run: make site-preview-prune

      - name: Comment on pruned previews
        if: steps.prune-previews.outputs.removed_prs_json != '' && steps.prune-previews.outputs.removed_prs_json != '[]'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REMOVED_PRS_JSON: ${{ steps.prune-previews.outputs.removed_prs_json }}
        with:
          script: |
            const removedPrs = JSON.parse(process.env.REMOVED_PRS_JSON);
            const marker = '<!-- Sticky Pull Request Commentpr-preview -->';
            for (const number of removedPrs) {
              const issue_number = Number(number);
              const body = `Preview deployment for PR #${number} removed.\n\n` +
                `We keep only the ${process.env.PREVIEW_RETENTION_LIMIT} most recently updated previews to stay within GitHub Pages size limits.\n\n` +
                `Push a new commit that changes the public site to generate a fresh preview.\n${marker}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number, per_page: 100,
              });
              const existing = [...comments].reverse().find(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              }
            }
