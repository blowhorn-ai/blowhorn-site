name: Site

# Builds and checks blowhorn.ai on every pull request and push to master, and
# deploys it to gh-pages (Settings > Pages > Source: gh-pages / root) on
# master. The toolchain is pinned in the repository: Go by go.mod (Hugo
# modules), Node.js by .nvmrc, and Hugo extended by package.json
# (hugo-extended). See docs/deploy.md.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, build and check
    runs-on: ubuntu-24.04
    steps:
      # Hugo module fetching reaches proxy.golang.org and sum.golang.org, and
      # the hugo-extended package downloads Hugo from github.com. Harmless under
      # egress-policy: audit; list them in allowed-endpoints before blocking.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Full history so Hugo's git info gives each page its own last-modified date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: make setup-ci

      - name: Lint workflows
        run: make workflow-check

      - name: Test check scripts
        run: make test-scripts

      # Every step below is a make target; `make ci` runs the same sequence locally.
      # site-check: check-schemas, then one production build into public/, then
      # validate-html, check-links, check-third-party, check-urls, check-no-internal,
      # check-theme, check-platform-docs and check-action-matrix.
      - name: Build and check site
        run: make site-check

      # Belt and braces: site-check runs this too. The public deploy must never
      # carry the /internal/ segment (see docs/deploy.md, "Internal section").
      - name: Fail if the public build contains /internal/
        run: .github/scripts/check-no-internal.sh public

      - name: Upload production build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-production-build
          path: public/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-production-build
          path: public

      # keep_files preserves pr-preview/ across production deployments.
      # peaceiris creates gh-pages on the first master deploy and adds .nojekyll.
      - name: Publish production without removing previews
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          cname: blowhorn.ai
